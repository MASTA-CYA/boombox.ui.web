<div class="progress-bar-container">
  <div class="outer">
    <div
      class="inner"
      [style.transform]="'translateX(' + (animatedProgress - 100) + '%)'"
      [style.color]="animatedProgress < 5 ? 'black' : 'white'"
      role="progressbar"
      [attr.aria-valuenow]="animatedProgress"
      aria-valuemax="100"
      aria-valuemin="0"
    >
    <!-- {{ animatedProgress }}% -->
  </div>
  </div>
</div>
