<div class="content-container">
  <aside>
    <app-sidebar></app-sidebar>
  </aside>
  <main
    #scrollContainer
    class="main-content"
    cdkVirtualScrollingElement
    (scroll)="onScroll($event)"
  >
    <app-main></app-main>
  </main>
  <!-- Deliberately outside <main>: cdkVirtualScrollingElement's .cdk-virtual-scrollable class sets
       contain: strict on <main>, which - like transform - makes it a new containing block for any
       position: fixed descendants. The snackbar, scroll button, and modal all rely on being positioned
       relative to the actual viewport, so they have to live outside <main> to escape that containment -
       previously the snackbar was nested inside <main>, which meant its "fixed" bottom-right position was
       actually anchored to <main>'s own scrolling content box, drifting away from the real viewport corner as
       you scrolled. The modal had the same bug for the same reason: centered-on-viewport positioning was
       actually centered on <main>'s scrolled content box, so scrolling down made the dialog appear pinned to
       the top of the (out-of-view) content instead of the center of the screen. -->
  <div class="snackbar-container">
    <app-snackbar></app-snackbar>
  </div>
  <app-modal>
    <div #modalContent></div>
  </app-modal>
  @if (showScrollButton) {
  <button class="scroll-button" (click)="onScrollToTop()">
    <svg-icon key="up-arrow" color="#FFFFFF" size="xl"></svg-icon>
  </button>
  }
</div>
