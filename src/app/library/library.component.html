<div class="library-container">
  @for (item of items; track item) {
  <mat-card class="library-item" appearance="raised">
    <img
      mat-card-image
      src="https://material.angular.dev/assets/img/examples/shiba2.jpg"
    />
    <div class="library-item-header-container">
      <p class="library-item-title">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
        tempor incididunt ut labore
      </p>
      <p class="library-item-sub-title">
        Sed ut perspiciatis unde omnis iste natus error sit voluptatem
        accusantium doloremque laudantium,
      </p>
    </div>
    <mat-card-actions>
      <div class="library-item-footer-container">
        <div class="library-item-footer-info-container">
          <mat-icon class="library-item-footer-icon">audiotrack</mat-icon>
          <span class="library-item-footer-text">6</span>
        </div>
        <span class="library-item-footer-separator"></span>
        <div class="library-item-footer-info-container">
          <mat-icon class="library-item-footer-icon">favorite</mat-icon>
          <span class="library-item-footer-text">2</span>
        </div>
        <span class="library-item-footer-separator"></span>
        <div class="library-item-footer-info-container">
          <mat-icon class="library-item-footer-icon">extension</mat-icon>
          <span class="library-item-footer-text">FLAC</span>
        </div>
      </div>
    </mat-card-actions>
  </mat-card>
  }
</div>
